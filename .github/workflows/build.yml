name: Build Windows VST3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, Standalone, DNnI inspector and regression tests
        shell: pwsh
        run: cmake --build build --config Release --target MetamorphRebuild_VST3 MetamorphRebuild_Standalone MetamorphCoreTests DnniInspector DnniReaderTests --parallel 2

      - name: Test audible morphing and waypoint recall
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse -Force "build/MetamorphRebuild_artefacts/Release/VST3/Metamorph CR.vst3" "dist/Metamorph CR.vst3"
          Copy-Item -Force "build/MetamorphRebuild_artefacts/Release/Standalone/Metamorph CR.exe" "dist/Metamorph CR.exe"
          Copy-Item -Force "build/DnniInspector_artefacts/Release/DnniInspector.exe" "dist/DnniInspector.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metamorph-CR-Windows-x64
          path: dist/**
          if-no-files-found: error
